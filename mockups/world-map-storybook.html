<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terra Questa — Storybook Parchment (mockup)</title>
<style>
  /* OFFLINE / self-contained — no fonts, images, or network. */
  *{box-sizing:border-box} html,body{margin:0}
  body{
    background:#0a1f17; color:#3a2c18;
    font-family:"Georgia","Iowan Old Style","Times New Roman",serif;
    display:flex; flex-direction:column; align-items:center; padding:26px 16px 60px;
    min-height:100vh;
  }
  .hint{color:#cfe7da;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;margin-bottom:14px;text-align:center;max-width:820px}
  .hint b{color:#f4d77a}
  .map-wrap{width:100%;max-width:1200px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  svg{display:block;width:100%;height:auto}
  /* interactivity cues */
  .region{cursor:pointer}
  .region .lift{transition:transform .18s ease, filter .18s ease;transform-origin:center;transform-box:fill-box}
  .region:hover .lift{transform:translateY(-4px) scale(1.06);filter:drop-shadow(0 6px 6px rgba(74,58,35,.4))}
  .region:hover .glow{opacity:.9}
  .label{font-size:17px;fill:#4a3a23;font-style:italic;paint-order:stroke;stroke:#f7efd8;stroke-width:3px;stroke-linejoin:round}
  .label.small{font-size:14px}
  .settlement-label{font-size:19px;fill:#3a2c18;font-weight:bold;letter-spacing:.4px}
  .uncharted .label{fill:#8a7a5c;font-style:italic}
  .soon-badge{font-family:"Segoe UI",system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;fill:#7a6442}
</style>
</head>
<body>
  <div class="hint">A storybook re-style of <b>Terra Questa</b> — your realm's atlas. Charted regions glow warm; uncharted ones sit under mist; locked lands wait as faded silhouettes. <b>Hover a region</b> to feel the click-to-enter interaction. <i>(Stand-in mockup for look approval — not final art.)</i></div>
  <div class="map-wrap">
  <svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terra Questa world map">
    <defs>
      <!-- emerald mat -->
      <radialGradient id="mat" cx="50%" cy="38%" r="80%">
        <stop offset="0%" stop-color="#1c5440"/>
        <stop offset="60%" stop-color="#123b2c"/>
        <stop offset="100%" stop-color="#0a241c"/>
      </radialGradient>
      <!-- parchment -->
      <radialGradient id="parch" cx="50%" cy="42%" r="75%">
        <stop offset="0%" stop-color="#f7efd6"/>
        <stop offset="62%" stop-color="#efe3c4"/>
        <stop offset="100%" stop-color="#e3d4ac"/>
      </radialGradient>
      <linearGradient id="goldframe" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fbeec0"/>
        <stop offset="42%" stop-color="#f4d77a"/>
        <stop offset="70%" stop-color="#c98a1e"/>
        <stop offset="100%" stop-color="#9c6a14"/>
      </linearGradient>
      <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f3e8c8"/>
        <stop offset="100%" stop-color="#e6d6a8"/>
      </linearGradient>
      <radialGradient id="goldglow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f4d77a" stop-opacity="0.75"/>
        <stop offset="55%" stop-color="#f4d77a" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#f4d77a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="homeglow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2fb380" stop-opacity="0.5"/>
        <stop offset="60%" stop-color="#2fb380" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#2fb380" stop-opacity="0"/>
      </radialGradient>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.29  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.05 0"/></filter>
      <filter id="softsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7a6442" flood-opacity="0.4"/></filter>
      <filter id="coastsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b9a878" flood-opacity="0.55"/></filter>
      <pattern id="hatch" width="9" height="9" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#a9b8b0" stroke-width="1" opacity="0.4"/></pattern>
      <!-- ICON SYMBOLS -->
            <symbol id="icon-castle" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 84 V52 H32 V44 H38 V52 H46 V40 H54 V52 H62 V44 H68 V52 H76 V84 Z" fill="#e7d8b0"/><rect x="22" y="56" width="56" height="28" fill="#f4d77a"/><path d="M24 84 V52 H32 V44 H38 V52 H46 V40 H54 V52 H62 V44 H68 V52 H76 V84" fill="none"/><rect x="42" y="66" width="16" height="18" rx="8" fill="#c98a1e"/><circle cx="31" cy="60" r="2.4" fill="#4a3a23" stroke="none"/><circle cx="69" cy="60" r="2.4" fill="#4a3a23" stroke="none"/><path d="M35 44 V30" /><path d="M35 30 q9 -3 9 4 q-9 -1 -9 3" fill="#1f8a60" stroke-width="2"/><path d="M65 44 V30" /><path d="M65 30 q9 -3 9 4 q-9 -1 -9 3" fill="#1f8a60" stroke-width="2"/><path d="M50 40 V24" /><path d="M50 24 q11 -3 11 5 q-11 -1 -11 3" fill="#c98a1e" stroke-width="2"/></g></symbol>
      <symbol id="icon-town" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 80 V58 L29 46 L42 58 V80 Z" fill="#f4d77a"/><path d="M16 58 L29 46 L42 58" fill="none"/><rect x="24" y="66" width="10" height="14" rx="3" fill="#c98a1e"/><path d="M58 82 V56 L72 43 L86 56 V82 Z" fill="#efe3c4"/><path d="M58 56 L72 43 L86 56" fill="none"/><rect x="66" y="64" width="12" height="18" rx="3" fill="#c98a1e"/><circle cx="72" cy="55" r="2.2" fill="#4a3a23" stroke="none"/><path d="M38 84 V62 L51 50 L64 62 V84 Z" fill="#e7d8b0"/><path d="M38 62 L51 50 L64 62" fill="none"/><rect x="46" y="70" width="10" height="14" rx="3" fill="#c98a1e"/></g></symbol>
      <symbol id="icon-tower" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M38 84 V40 a12 12 0 0 1 24 0 V84 Z" fill="#f4d77a"/><path d="M34 40 L50 16 L66 40 Z" fill="#1f8a60"/><circle cx="50" cy="54" r="6" fill="#c98a1e"/><path d="M44 70 h12" /><path d="M50 16 V8" /><path d="M50 8 q9 -2 9 4 q-9 -1 -9 3" fill="#c98a1e" stroke-width="2"/><path d="M38 84 h24" stroke-width="3.4"/></g></symbol>
      <symbol id="icon-lighthouse" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 84 L44 44 H56 L60 84 Z" fill="#efe3c4"/><path d="M44 44 H56" /><path d="M43 56 L57 56" /><path d="M42 70 L58 70" /><rect x="42" y="56" width="16" height="14" fill="#c98a1e" stroke="none"/><path d="M40 84 L44 44 H56 L60 84 Z" fill="none"/><rect x="41" y="36" width="18" height="9" rx="2" fill="#fbeec0"/><circle cx="50" cy="30" r="6" fill="#f4d77a"/><path d="M44 24 L66 14 M44 30 H70 M44 36 L66 46" stroke="#f4d77a" stroke-width="2.4"/><path d="M44 30 L48 26 L52 30 L56 26 L60 30" stroke="#4a3a23" stroke-width="2" fill="none"/></g></symbol>
      <symbol id="icon-anchor" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="22" r="7" fill="#fbeec0"/><path d="M50 29 V74" /><path d="M34 44 H66" /><path d="M24 56 a26 26 0 0 0 52 0" fill="none" stroke="#c98a1e"/><path d="M24 56 l-6 -3 M24 56 l1 -7" stroke="#c98a1e"/><path d="M76 56 l6 -3 M76 56 l-1 -7" stroke="#c98a1e"/><circle cx="50" cy="22" r="2.4" fill="#4a3a23" stroke="none"/></g></symbol>
      <symbol id="icon-forest" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 80 V72" stroke="#c98a1e"/><path d="M68 80 V70" stroke="#c98a1e"/><path d="M30 72 q-12 0 -12 -11 q-9 -2 -3 -11 q-2 -10 9 -9 q5 -9 13 -2 q11 -3 9 9 q8 4 0 12 q1 11 -11 11 q-7 5 -14 1 Z" fill="#1f8a60"/><path d="M50 84 V62 L36 62 L50 44 L64 62 L50 62" fill="#f4d77a" stroke="#4a3a23"/><path d="M50 84 V62 M36 62 L50 44 L64 62 Z M50 56 L40 56 M50 56 L60 56" fill="#f4d77a"/><path d="M50 84 V62 M36 62 L50 44 L64 62 L50 62 M44 53 L50 47 L56 53" fill="none"/><path d="M48 84 H52" stroke="#c98a1e"/></g></symbol>
      <symbol id="icon-mountains" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 78 L36 40 L58 78 Z" fill="#e7d8b0"/><path d="M44 78 L66 36 L88 78 Z" fill="#f4d77a"/><path d="M14 78 L36 40 L58 78 Z" fill="none"/><path d="M28 53 q4 5 8 0 q4 -5 8 0 l-2 8 q-6 -4 -12 0 Z" fill="#fbeec0" stroke-width="2"/><path d="M58 50 q4 5 8 0 q4 -5 8 0 l-2 8 q-6 -4 -12 0 Z" fill="#fbeec0" stroke-width="2"/><path d="M44 78 L66 36 L88 78" fill="none"/></g></symbol>
      <symbol id="icon-marsh" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 74 q12 -6 24 0 q12 6 24 0 q10 -5 20 0" stroke="#b9c6c0" stroke-width="3.2"/><path d="M16 82 q12 -6 24 0 q12 6 24 0 q10 -5 20 0" stroke="#b9c6c0" stroke-width="3.2"/><path d="M36 74 V44" stroke="#1f8a60"/><rect x="32" y="30" width="8" height="14" rx="4" fill="#c98a1e"/><path d="M52 74 V40" stroke="#1f8a60"/><rect x="48" y="24" width="8" height="16" rx="4" fill="#c98a1e"/><path d="M68 74 V48" stroke="#1f8a60"/><rect x="64" y="36" width="8" height="12" rx="4" fill="#c98a1e"/><path d="M44 74 V52 M60 74 V56" stroke="#1f8a60" stroke-width="2.4"/></g></symbol>
      <symbol id="icon-mist" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 38 q-6 -8 4 -10 q2 -9 12 -5 q8 -8 16 0 q12 -3 10 8 q9 1 4 9" fill="#efe3c4" stroke="#c98a1e"/><path d="M24 50 q14 -6 28 0 q14 6 28 0" stroke="#b9c6c0" stroke-width="3.4"/><path d="M20 62 q14 -6 28 0 q14 6 28 0" stroke="#b9c6c0" stroke-width="3.4"/><path d="M26 74 q14 -6 28 0 q12 5 24 0" stroke="#b9c6c0" stroke-width="3.4"/></g></symbol>
      <symbol id="icon-compass" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="34" fill="#fbeec0"/><circle cx="50" cy="50" r="34" fill="none" stroke-width="3.2"/><circle cx="50" cy="50" r="27" fill="none" stroke="#c98a1e" stroke-width="2"/><path d="M50 22 L57 50 L50 78 L43 50 Z" fill="#e7d8b0"/><path d="M50 22 L43 50 L50 78" fill="#1f8a60" stroke="none"/><path d="M50 22 L57 50 L50 78 L43 50 Z" fill="none"/><path d="M22 50 L50 43 L78 50 L50 57 Z" fill="#f4d77a"/><path d="M22 50 L50 43 L78 50 L50 57 Z" fill="none"/><circle cx="50" cy="50" r="3.4" fill="#c98a1e" stroke="none"/><path d="M50 12 L52 16 L48 16 Z" fill="#c98a1e" stroke-width="1.6"/></g></symbol>
      <symbol id="icon-serpent" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 76 q10 -4 20 0" stroke="#b9c6c0" stroke-width="3"/><path d="M64 76 q10 -4 20 0" stroke="#b9c6c0" stroke-width="3"/><path d="M22 74 q8 -12 18 -2 q9 9 18 -2 q9 -10 18 0 q8 9 4 16" fill="none" stroke="#1f8a60" stroke-width="5"/><path d="M22 74 q8 -12 18 -2 q9 9 18 -2 q9 -10 18 0 q8 9 4 16" fill="none"/><path d="M80 88 q5 -6 0 -14 q-7 -4 -10 2 q3 5 10 4 Z" fill="#f4d77a"/><circle cx="74" cy="80" r="2" fill="#4a3a23" stroke="none"/><path d="M14 28 q6 -4 12 0 M14 38 q6 -4 12 0" stroke="#b9c6c0" stroke-width="2.4"/></g></symbol>
      <symbol id="icon-ship" viewBox="0 0 100 100"><g fill="none" stroke="#4a3a23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 64 H78 L70 80 H30 Z" fill="#c98a1e"/><path d="M22 64 H78 L70 80 H30 Z" fill="none"/><path d="M50 60 V20" /><path d="M50 22 q20 4 18 22 q-9 -4 -18 -2 Z" fill="#efe3c4"/><path d="M50 26 q-15 4 -14 18 q7 -3 14 -2 Z" fill="#f4d77a"/><path d="M50 60 V20" /><path d="M50 14 V20" /><path d="M50 14 q7 -2 7 3 q-7 -1 -7 2" fill="#1f8a60" stroke-width="2"/><path d="M16 70 q6 -4 12 0 M72 70 q6 -4 12 0" stroke="#b9c6c0" stroke-width="2.6"/></g></symbol>
    </defs>

    <!-- emerald mat -->
    <rect x="0" y="0" width="1200" height="820" fill="url(#mat)"/>
    <rect x="0" y="0" width="1200" height="820" fill="#000" opacity="0.16" style="mix-blend-mode:multiply"/>

    <!-- parchment sheet -->
    <g filter="url(#softsh)">
      <rect x="40" y="40" width="1120" height="740" rx="10" fill="url(#parch)"/>
    </g>
    <rect x="40" y="40" width="1120" height="740" rx="10" fill="#fff" filter="url(#grain)" opacity="0.5"/>
    <!-- aged corner stains -->
    <ellipse cx="110" cy="110" rx="80" ry="55" fill="#c9a86a" opacity="0.12"/>
    <ellipse cx="1090" cy="720" rx="95" ry="60" fill="#c9a86a" opacity="0.12"/>
    <ellipse cx="1080" cy="120" rx="70" ry="48" fill="#b89a5c" opacity="0.10"/>

    <!-- water wash over ocean areas -->
    <rect x="56" y="56" width="1088" height="708" rx="6" fill="#cdd8d0" opacity="0.5"/>
    <rect x="56" y="56" width="1088" height="708" rx="6" fill="url(#hatch)"/>
    <!-- swell lines -->
    <g stroke="#a9b8b0" stroke-width="1.4" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M120 150 q18 -10 36 0 t36 0"/><path d="M980 660 q18 -10 36 0 t36 0"/>
      <path d="M150 700 q18 -10 36 0 t36 0"/><path d="M1000 180 q18 -10 36 0 t36 0"/>
    </g>

    <!-- ===== LANDMASSES (soft wobbled storybook coastlines) ===== -->
    <g filter="url(#coastsh)">
      <!-- main continent -->
      <path d="M250 300
        C 210 250 250 200 330 190 C 410 178 470 150 560 158 C 660 166 700 140 790 162
        C 880 184 940 180 980 250 C 1010 300 980 360 940 400 C 980 450 960 520 900 560
        C 850 595 820 640 740 650 C 660 660 600 700 520 690 C 440 680 380 700 320 660
        C 250 612 230 560 240 500 C 200 470 210 400 250 360 C 232 338 236 318 250 300 Z"
        fill="url(#land)" stroke="#9c7e4a" stroke-width="2.5"/>
      <!-- northern peninsula (Goldfield/Sunmeadow uplands) blends in; add a small island NE -->
      <path d="M958 330 C 985 312 1020 320 1030 350 C 1040 380 1018 405 988 400 C 960 396 944 360 958 330 Z"
        fill="url(#land)" stroke="#9c7e4a" stroke-width="2.2"/>
      <!-- SW isle (Ashlands) -->
      <path d="M165 645 C 150 622 185 600 220 612 C 258 624 262 668 232 686 C 200 704 178 678 165 645 Z"
        fill="url(#land)" stroke="#9c7e4a" stroke-width="2.2" opacity="0.92"/>
      <!-- SE isle (Beyond the Veil) -->
      <path d="M1010 620 C 1000 598 1035 585 1066 600 C 1096 615 1090 656 1058 666 C 1028 675 1016 648 1010 620 Z"
        fill="url(#land)" stroke="#9c7e4a" stroke-width="2.2" opacity="0.85"/>
    </g>

    <!-- subtle region watercolor tints -->
    <g opacity="0.5" style="mix-blend-mode:multiply">
      <ellipse cx="320" cy="280" rx="95" ry="70" fill="#cdbf8a"/>
      <ellipse cx="600" cy="430" rx="120" ry="90" fill="#d7c98e"/>
      <ellipse cx="780" cy="280" rx="95" ry="70" fill="#d3c184"/>
      <ellipse cx="560" cy="640" rx="110" ry="70" fill="#b9bf8a"/>
    </g>

    <!-- rivers -->
    <g stroke="#aebfb4" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M900 240 C 840 300 780 320 720 400 C 690 440 640 470 600 540"/>
      <path d="M320 300 C 340 360 300 410 270 470"/>
    </g>

    <!-- ===== REGIONS ===== -->
    <!-- charted region helper: glow + icon(lift) + label -->

    <!-- Vale of Embergreen (forest) NW -->
    <g class="region"><circle class="glow" cx="320" cy="262" r="46" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-forest" x="284" y="222" width="72" height="72"/>
      <text class="label" x="320" y="316" text-anchor="middle">Vale of Embergreen</text></g>

    <!-- Goldfield March (town) N -->
    <g class="region"><circle class="glow" cx="556" cy="222" r="44" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-town" x="522" y="186" width="68" height="68"/>
      <text class="label" x="556" y="274" text-anchor="middle">Goldfield March</text></g>

    <!-- Sunmeadow Hold (castle) N-central -->
    <g class="region"><circle class="glow" cx="772" cy="244" r="48" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-castle" x="734" y="202" width="76" height="76"/>
      <text class="label" x="772" y="300" text-anchor="middle">Sunmeadow Hold</text></g>

    <!-- Crownspire Peaks (mountains) NE -->
    <g class="region"><circle class="glow" cx="900" cy="300" r="46" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-mountains" x="862" y="262" width="76" height="76"/>
      <text class="label" x="900" y="356" text-anchor="middle">Crownspire Peaks</text></g>

    <!-- Tide's End (tower) W coast -->
    <g class="region"><circle class="glow" cx="300" cy="450" r="44" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-tower" x="268" y="412" width="64" height="64"/>
      <text class="label" x="300" y="500" text-anchor="middle">Tide&#8217;s End</text></g>

    <!-- Greymoor (tower) central-E -->
    <g class="region"><circle class="glow" cx="838" cy="450" r="44" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-tower" x="806" y="412" width="64" height="64"/>
      <text class="label" x="838" y="500" text-anchor="middle">Greymoor</text></g>

    <!-- Larkholt (town) S-central -->
    <g class="region"><circle class="glow" cx="640" cy="600" r="44" fill="url(#goldglow)" opacity="0.5"/>
      <use class="lift" href="#icon-town" x="606" y="566" width="68" height="68"/>
      <text class="label" x="640" y="652" text-anchor="middle">Larkholt</text></g>

    <!-- Quiet Fens (marsh) S -->
    <g class="region"><circle class="glow" cx="470" cy="660" r="42" fill="url(#goldglow)" opacity="0.45"/>
      <use class="lift" href="#icon-marsh" x="438" y="628" width="64" height="64"/>
      <text class="label small" x="470" y="708" text-anchor="middle">Quiet Fens</text></g>

    <!-- Mist Isles (mist) NE island -->
    <g class="region"><use class="lift" href="#icon-mist" x="956" y="330" width="64" height="64"/>
      <text class="label small" x="988" y="390" text-anchor="middle">Mist Isles</text></g>

    <!-- ===== SETTLEMENTS (gold-ringed, home) ===== -->
    <!-- Greenhaven Heartland (home) center -->
    <g class="region">
      <circle class="glow" cx="600" cy="430" r="60" fill="url(#homeglow)"/>
      <circle cx="600" cy="430" r="50" fill="none" stroke="url(#goldframe)" stroke-width="4"/>
      <circle cx="600" cy="430" r="50" fill="none" stroke="#9c6a14" stroke-width="1" opacity="0.5"/>
      <use class="lift" href="#icon-town" x="562" y="392" width="76" height="76"/>
      <text class="settlement-label" x="600" y="510" text-anchor="middle" paint-order="stroke" stroke="#f7efd8" stroke-width="4">Greenhaven Heartland</text>
      <text x="600" y="528" text-anchor="middle" font-size="12" font-style="italic" fill="#7a6442">— your home —</text>
    </g>

    <!-- Goldport Harbor (coast) -->
    <g class="region">
      <circle class="glow" cx="270" cy="560" r="56" fill="url(#goldglow)" opacity="0.7"/>
      <circle cx="270" cy="560" r="46" fill="none" stroke="url(#goldframe)" stroke-width="4"/>
      <use class="lift" href="#icon-lighthouse" x="238" y="520" width="64" height="64"/>
      <use href="#icon-anchor" x="296" y="566" width="34" height="34" opacity="0.85"/>
      <text class="settlement-label" x="270" y="634" text-anchor="middle" paint-order="stroke" stroke="#f7efd8" stroke-width="4">Goldport Harbor</text>
    </g>

    <!-- ===== UNCHARTED (faded, dashed, mist) ===== -->
    <g class="region uncharted" opacity="0.72">
      <path d="M165 645 C 150 622 185 600 220 612 C 258 624 262 668 232 686 C 200 704 178 678 165 645 Z"
        fill="none" stroke="#8a7a5c" stroke-width="2" stroke-dasharray="6 5"/>
      <use href="#icon-mist" x="178" y="628" width="56" height="56" opacity="0.8"/>
      <text class="label small" x="200" y="704" text-anchor="middle">The Ashlands</text>
    </g>
    <g class="region uncharted" opacity="0.62">
      <use href="#icon-mist" x="1024" y="618" width="56" height="56" opacity="0.8"/>
